# PySR-paper budget for the Feynman baseline (FEY-B, RESEARCH_LOG 83).
# configs/feynman_benchmark_v3.toml with only the PySR search budget changed to
# what Cranmer 2023 (arXiv 2305.01582) states for its benchmark (EmpiricalBench,
# section 3.2.1; Algorithm 1 defaults): 8 cores, up to 1 hour per search,
# 40 populations of 1000 expressions. Operators, maxsize, loss, model selection
# and early stop are unchanged from v3 (the paper gives no values for them).
# Submit with -c 8 and TIMEOUT_MINUTES=60 (the job script overrides both).

[data]
kind = "supervised"
data_dir = "data/feynman"
dataset_name = "set_per_equation"
dataset_key = "X"
target_key = "y"
feature_names = ["set_per_equation"]
validation_size = 0.1
test_size = 0.1
random_state = 42
shuffle = true
target_transform = "log"

[augmentation]
enabled = false

[input_transform]
kind = "log"

[encoder]
enabled = true
output_dim = 1
init = "random"

[normalization]
enabled = true
mode = "standard"

[model]
hidden_dims = [64, 64]
output_activation = "none"
standardize_target = true

[loss]
lambda_structure = 0.0
lambda_encoder_l1_ratio = 0.0
lambda_encoder_l2 = 0.0

[train]
run_id = "feynman_benchmark"
results_dir = "results/feynman_benchmark"
split_dir = "results/feynman_benchmark/splits"
use_saved_split = true
save_split_if_missing = true
seed = 42
epochs = 3000
batch_size = 0
learning_rate = 1e-3
encoder_learning_rate_scale = 30.0
# CPU is as fast as MPS for this small MLP and is reproducible.
device = "cpu"
log_every = 25
save_every = 0
lr_plateau_min_delta = 0.0
early_stopping_min_delta = 0.0
early_stopping_patience = 20

[adaptive]
results_subdir = "set_per_equation"
metric = "nrmse"
nrmse_threshold = 0.01
stop_on_first_success = true
restarts = 3
acceptance = "relative_to_reference"
relative_factor = 2.0
relative_floor = 1e-3
reference_init = true

[sparsification]
method = "snap"
snap_denominators = [1, 2, 3, 4, 6]
masked_refit_epochs = 1500
masked_refit_learning_rate = 3e-3
masked_refit_schedule = "cosine"
masked_refit_min_learning_rate = 1e-5
snap_basis = "rref"
snap_acceptance = "relative_to_dense"
run_id = "stage2_snap"

[symbolic]
# Shared by both arms; only the inputs differ (monomial groups vs raw inputs).
target_source = "data"
target_transform = "exp"
encoded_feature_transform = "exp"
output_subdir = "stage3_pysr"
run_id = "pysr_search"
weight_mode = "none"
elementwise_loss = "loss(prediction, target) = (prediction - target)^2"
binary_operators = ["+", "-", "*", "/"]
unary_operators = ["square", "sqrt", "exp", "log", "sin", "cos"]
constraints = {}
nested_constraints = { exp = { exp = 0, log = 0 }, log = { exp = 0, log = 0 }, sin = { sin = 0, cos = 0 }, cos = { sin = 0, cos = 0 } }
maxsize = 35
maxdepth = -1
parsimony = 0.0
complexity_of_constants = 1
model_selection = "best"
parallelism = "multithreading"
numprocs = 8
populations = 40
population_size = 1000
ncycles_per_iteration = 500
niterations = 1000000
timeout_hours = 1.0
batching = false
warm_start = false
progress = false
precision = 64
random_state = 42
