# Pilot v2: published Feynman I.6.20a with theta replaced by a+b.
# Same data and split as adaptive_encoder_feynman_gaussian_sum.toml; differs in:
# - selection uses nrmse = rmse / std(y), a scale-free threshold;
# - Stage 1 does not stop on absolute MSE deltas sized for yield-surface targets,
#   trains the encoder with a larger learning rate than the MLP, and keeps the
#   best of several random restarts per n;
# - Stage 2 refits every 1-3 term support instead of the largest coefficients.
# Generate the paired data with scripts/prepare_feynman_gaussian.py first.

[data]
kind = "supervised"
data_dir = "data/feynman_gaussian"
dataset_name = "i_6_20a_sum"
dataset_key = "X"
target_key = "y"
feature_names = ["a", "b"]
validation_size = 0.1
test_size = 0.1
random_state = 42
shuffle = true

[augmentation]
enabled = false

[input_transform]
kind = "pairwise"
include_products = true
include_ratios = true
denominator_floor = 1e-6

[encoder]
enabled = true
output_dim = 1
init = "random"

[normalization]
enabled = true
mode = "scale_only"

[model]
hidden_dims = [64, 64]
output_activation = "softplus"

[loss]
lambda_structure = 0.0
lambda_encoder_l1_ratio = 0.0
lambda_encoder_l2 = 0.0

[train]
run_id = "feynman_i_6_20a_sum_v2_base"
results_dir = "results"
split_dir = "results/splits"
use_saved_split = true
save_split_if_missing = true
seed = 42
epochs = 3000
batch_size = 0
learning_rate = 1e-3
# With one shared learning rate the MLP adapts to whatever J it is given and
# the encoder direction barely moves; 30x lets S reach the a+b family from
# every tested seed (val nrmse ~0.001 instead of 0.015-0.035).
encoder_learning_rate_scale = 30.0
log_every = 25
save_every = 100
# Targets here have std ~0.08, so MSE is ~1e-5; absolute deltas of 1e-6 would
# stop or decay training while it is still improving.
lr_plateau_min_delta = 0.0
early_stopping_min_delta = 0.0
early_stopping_patience = 20

[adaptive]
results_subdir = "feynman_i_6_20a_sum_v2"
metric = "nrmse"
nrmse_threshold = 0.01
n_min = 1
n_max = 2
stop_on_first_success = true
# Cheap insurance against an unlucky initialization; keeps the best per n.
restarts = 3

[sparsification]
# No sparsity-penalty phase: every support is refit from the Stage 1 weights.
method = "lasso"
epochs = 0
support_search = "exhaustive"
adaptive_max_active_terms = true
max_active_terms_candidates = [1, 2, 3]
masked_refit_epochs = 1500
masked_refit_learning_rate = 3e-3
masked_refit_schedule = "cosine"
masked_refit_min_learning_rate = 1e-5
threshold = 0.02
run_id = "stage2_sparse"

[symbolic]
target_source = "data"
target_transform = "identity"
output_subdir = "stage3_pysr"
run_id = "pysr_search"
weight_mode = "none"
elementwise_loss = "loss(prediction, target) = (prediction - target)^2"
binary_operators = ["+", "-", "*", "/"]
unary_operators = ["square", "exp"]
constraints = {}
nested_constraints = {}
maxsize = 25
parsimony = 0.001
parallelism = "multithreading"
numprocs = 4
populations = 8
population_size = 40
ncycles_per_iteration = 500
niterations = 1000000
timeout_hours = 0.25
early_stop_condition = "stop_if(loss, complexity) = loss < 1e-10"
