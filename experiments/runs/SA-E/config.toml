# Synthetic SA (rotated quadratic forms): configs/feynman_benchmark_v3.toml with
# identity targets, a product feature map (x_i, x_i x_j) so an encoder row is a
# quadratic form, and graded Stage 2 as for CB2001 (dense rows: gated Stage 2
# removed true terms, val nrmse 3e-3 -> 0.16-0.29, RESEARCH_LOG 77).
# Dev runs: RESEARCH_LOG 77.
# Data: scripts/prepare_synthetic_benchmark.py; run with
#   --manifest data/synthetic/sa/manifest.json

[data]
kind = "supervised"
data_dir = "data/synthetic/sa"
dataset_name = "set_per_equation"
dataset_key = "X"
target_key = "y"
feature_names = ["set_per_equation"]
validation_size = 0.1
test_size = 0.1
random_state = 42
shuffle = true
target_transform = "identity"

[augmentation]
enabled = false

[input_transform]
kind = "pairwise"
include_products = true
include_ratios = false

[encoder]
enabled = true
output_dim = 1
init = "random"

[normalization]
enabled = true
mode = "standard"

[model]
hidden_dims = [64, 64]
activation = "silu"
output_activation = "none"
standardize_target = true

[loss]
lambda_structure = 0.0
lambda_encoder_l1_ratio = 0.0
lambda_encoder_l2 = 0.0

[train]
run_id = "feynman_benchmark"
results_dir = "results/feynman_benchmark"
split_dir = "results/feynman_benchmark/splits"
use_saved_split = true
save_split_if_missing = true
seed = 42
epochs = 3000
batch_size = 0
learning_rate = 1e-3
encoder_learning_rate_scale = 30.0
# CPU is as fast as MPS for this small MLP and is reproducible.
device = "cpu"
log_every = 25
save_every = 0
lr_plateau_min_delta = 0.0
early_stopping_min_delta = 0.0
early_stopping_patience = 20

[adaptive]
results_subdir = "set_per_equation"
metric = "nrmse"
# Absolute: the no-bottleneck reference on these features is weaker than the
# true bottleneck (7.5e-3 vs 3e-3), so "2 x reference" accepts too small an n
# (sqrt(q1) + q2, n = 1 at 1.3e-2; RESEARCH_LOG 77).
nrmse_threshold = 0.005
stop_on_first_success = true
restarts = 3
acceptance = "absolute"

[sparsification]
method = "graded"
masked_refit_epochs = 4000
masked_refit_learning_rate = 3e-3
masked_refit_schedule = "cosine"
masked_refit_min_learning_rate = 1e-5
run_id = "stage2_graded"

[symbolic]
# Shared by both arms; only the inputs differ (monomial groups vs raw inputs).
target_source = "data"
target_transform = "identity"
encoded_feature_transform = "identity"
output_subdir = "stage3_pysr"
run_id = "pysr_search"
weight_mode = "none"
elementwise_loss = "loss(prediction, target) = (prediction - target)^2"
binary_operators = ["+", "-", "*", "/"]
unary_operators = ["square", "cube", "sqrt", "cbrt"]
constraints = {}
nested_constraints = {}
maxsize = 35
maxdepth = -1
parsimony = 0.0
complexity_of_constants = 1
model_selection = "best"
parallelism = "multithreading"
numprocs = 10
populations = 30
population_size = 50
ncycles_per_iteration = 500
niterations = 1000000
timeout_hours = 0.25
batching = false
warm_start = false
progress = false
precision = 64
random_state = 42
